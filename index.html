<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinn</title>
    <meta name="description" content="Vind je balans met Vinn." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f6f2" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <style>
      :root {
        --bg: #f6f6f2;
        --tekst: #0c1613;
        --zacht: #535e5a;
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 50% 42%, #44d6a526, transparent 70%),
          var(--bg);
        color: var(--tekst);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        padding: 24px 16px;
        box-sizing: border-box;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22.5%;
        box-shadow: 0 18px 40px -16px #06121059;
      }
      h1 {
        font-size: clamp(36px, 7vw, 60px);
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 28px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="favicon-192.png" alt="Vinn" />
      <h1>Vind je balans met Vinn</h1>
    </main>
  </body>
</html>
